name: Deploy to Cloudflare Pages

# Publishes the static site to the Cloudflare Pages project "samurai-motors".
# Runs on every push to main, after each catalogue refresh (the refresh bot's
# own push does not trigger "push" workflows), and on demand.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. Without them the job is skipped, not failed.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh catalogue mirror"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dist
        if: steps.gate.outputs.ready == 'true'
        run: bash tools/build_dist.sh

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name samurai-motors --branch main --commit-dirty=true
